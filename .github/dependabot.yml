version: 2
updates:
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      bevy:
        patterns: ["bevy*"]
      wasm-bindgen:
        patterns: ["wasm-bindgen", "wasm-bindgen-futures", "web-sys"]
      ratatui:
        patterns: ["ratatui-core", "ratatui-widgets", "ratatui-crossterm"]
      cargo-patch:
        patterns: ["*"]
        update-types: [patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
