[package]
name = "plurimus_web"
description = "Browser integration for plurimus: a WebGL2 terminal canvas, browser input, and a requestAnimationFrame runner."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
plurimus_core = { workspace = true }
plurimus_term = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_app = { workspace = true, features = ["web"] }
critical-section = { workspace = true, features = ["std"] }
js-sys = { workspace = true }
ratatui-core = { workspace = true }
ratzilla = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true }

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[lints]
workspace = true
