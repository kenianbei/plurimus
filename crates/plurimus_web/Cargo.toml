[package]
name = "plurimus_web"
description = "Browser integration for plurimus: a WebGL2 terminal canvas, browser input, and a requestAnimationFrame runner."
version.workspace = true
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["bevy", "ratatui", "wasm", "webgl", "terminal"]
categories = ["wasm", "web-programming", "game-development"]
rust-version.workspace = true

[dependencies]
bevy_app = { workspace = true }
bevy_ecs = { workspace = true }
plurimus_core = { workspace = true }
plurimus_term = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy_app = { workspace = true, features = ["web"] }
console_error_panic_hook = { workspace = true }
critical-section = { workspace = true, features = ["std"] }
ratzilla = { workspace = true }
wasm-bindgen = { workspace = true }
wasm-bindgen-futures = { workspace = true }
web-sys = { workspace = true, features = [
  "AddEventListenerOptions",
  "CanvasRenderingContext2d",
  "ClipboardEvent",
  "Clipboard",
  "CustomEvent",
  "CssStyleDeclaration",
  "CustomEventInit",
  "DataTransfer",
  "Document",
  "Element",
  "Event",
  "EventTarget",
  "FontFaceSet",
  "HtmlCanvasElement",
  "HtmlElement",
  "ImageData",
  "KeyboardEvent",
  "MouseEvent",
  "Navigator",
  "PointerEvent",
  "WheelEvent",
  "Window",
  "console",
] }

[package.metadata.docs.rs]
targets = ["wasm32-unknown-unknown"]

[lints]
workspace = true
